<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXPENSE TRACKER</title>
  </head>
  <body>
    <div class="container">
      <h1>Daily Expense Tracker</h1>
      <div class="form-card">
        <input
          type="text"
          id="description"
          name="expense-description"
          placeholder="Description e.g. Lunch"
        />
        <input
          type="number"
          id="amount"
          name="expense-amount"
          placeholder="Amount"
        />
      </div>
    </div>
  </body>
</html>
